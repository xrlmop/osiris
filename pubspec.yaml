name: osiris
description: "OSIRIS PASS - Decentralized Multi-Vault Keeper"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.13.0'

dependencies:
  flutter:
    sdk: flutter

  cryptography: ^2.5.0
  path_provider: ^2.1.3
  path: ^1.9.0
  universal_html: ^2.3.0
  pointycastle: ^4.0.0
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/icon.jpg"
  min_sdk_android: 21
